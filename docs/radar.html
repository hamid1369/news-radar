<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار خبر و بازار</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a727c;--bd:#e1e4e8;--ac:#1a6ef0;--up:#12915a;--dn:#d23b3b}
@media(prefers-color-scheme:dark){:root{--bg:#101317;--card:#181c22;--tx:#e7eaee;--mut:#98a1ab;--bd:#2a3038;--ac:#6aa2ff;--up:#3ccf8e;--dn:#ff7a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;font-size:15px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:960px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0}.m{color:var(--mut);font-size:12px}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mut)}
.l{color:var(--ac);cursor:pointer}.l:hover{text-decoration:underline}a{color:var(--ac);text-decoration:none}
.up{color:var(--up)}.dn{color:var(--dn)}select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.p{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}.p.on{display:flex}
.s{background:var(--card);width:100%;max-width:820px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.x{float:left;border:0;background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.k div{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.k b{display:block;font-size:18px}
.e{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}h2{font-size:17px;margin:0 0 4px}h3{font-size:14px;margin:14px 0 4px}
</style></head><body><div class="w">
<h1>رادار خبر و بازار</h1><div class="m" id="up">در حال بارگذاری…</div>
<p class="m">اعداد واکنش از قیمت واقعی بیت‌کوین (Yahoo Finance) محاسبه می‌شوند. این صفحه توصیه‌ی مالی نیست و هیچ احتمالی ۱۰۰٪ نیست.</p>
<p><select id="f"></select></p>
<div class="sc"><table><thead><tr><th>زمان</th><th>منبع</th><th>تیتر (کلیک برای اخبار مشابه)</th><th>تحلیل</th></tr></thead><tbody id="r"></tbody></table></div></div>
<div class="p" id="p"><div class="s" id="s"></div></div>
<script>
var D,$=function(i){return document.getElementById(i)},p=$("p"),s=$("s");
function E(x){var d=document.createElement("div");d.textContent=x;return d.innerHTML}
function F(n){return n==null?"—":(n>0?"+":"")+n.toFixed(1)+"٪"}function C(n){return n>=0?"up":"dn"}
function T(z){return new Date(z).toLocaleString("fa-IR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
window.onerror=function(m){document.getElementById("up").textContent="خطای صفحه: "+m};
$("up").textContent="نسخه ۳ · در حال دریافت داده…";
function G(u){return fetch(u+"?"+Date.now()).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})}
G("https://raw.githubusercontent.com/hamid1369/news-radar/main/docs/data.json").catch(function(){return G("data.json")}).then(function(t){return JSON.parse(t)}).then(function(d){D=d;
 $("up").textContent="آخرین به‌روزرسانی: "+T(d.updated)+" · بیت‌کوین: $"+d.btc_last.toLocaleString("en-US");
 var o='<option value="">همه‌ی خبرهای دسته‌بندی‌شده</option>';for(var c in d.cats)o+='<option value="'+c+'">'+d.cats[c].label+'</option>';
 $("f").innerHTML=o;$("f").onchange=R;R()}).catch(function(e){$("up").textContent="خطا: "+e.message});
function R(){var f=$("f").value,h="";D.news.filter(function(n){return f?n.c===f:n.c}).slice(0,80).forEach(function(n){var i=D.news.indexOf(n);
 h+='<tr><td class="m">'+T(n.z)+'</td><td>'+E(n.s)+' <a href="'+n.u+'" target="_blank" rel="noopener">↗</a></td><td><span class="l" data-a="'+i+'" data-m="s">'+E(n.ti)+'</span><div class="m">'+D.cats[n.c].label+'</div></td><td><span class="l" data-a="'+i+'" data-m="a">تحلیل ←</span></td></tr>'});
 $("r").innerHTML=h||'<tr><td colspan="4" class="m">خبری نیست.</td></tr>'}
function O(h){s.innerHTML='<button class="x" data-x>بستن</button>'+h;p.classList.add("on")}
function EV(ev){return ev.map(function(e){return '<div class="e"><div>'+E(e.t)+'<div class="m">'+e.d+'</div></div><div><span class="'+C(e.r1)+'">'+F(e.r1)+'</span> · <span class="'+C(e.r7||0)+'">'+F(e.r7)+'</span><div class="m">همان روز · ۷ روز</div><span class="l" data-ch="'+e.d+'">نمودار ←</span></div></div>'}).join("")}
function CH(d){O('<h2>نمودار بیت‌کوین</h2><div class="m">از یک روز قبل تا ۷ روز بعد از '+d+' (روزانه، دلار)</div><div id="ch" class="m">در حال بارگذاری…</div>');
 var t=Date.parse(d+"T00:00:00Z")/1000,end=Math.min(t+7*86400,Math.floor(Date.now()/1000)),y="https://finance.yahoo.com/quote/BTC-USD/history/?period1="+(t-86400)+"&period2="+(t+8*86400);
 fetch("https://min-api.cryptocompare.com/data/v2/histoday?fsym=BTC&tsym=USD&limit=8&toTs="+end).then(function(r){return r.json()}).then(function(j){
  var a=j.Data.Data.filter(function(x){return x.time>=t-86400&&x.time<=end&&x.close>0});if(a.length<2)throw 0;
  var W=340,H=170,P=26,lo=Math.min.apply(0,a.map(function(x){return x.close})),hi=Math.max.apply(0,a.map(function(x){return x.close})),sp=(hi-lo)||1,
  X=function(i){return P+i*(W-2*P)/(a.length-1)},Y=function(v){return H-P-(v-lo)/sp*(H-2*P)},pts=a.map(function(x,i){return X(i)+","+Y(x.close)}).join(" "),k=a.findIndex(function(x){return x.time===t}),
  ch=(a[a.length-1].close/a[0].close-1)*100,h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="direction:ltr"><polyline points="'+pts+'" fill="none" style="stroke:var(--ac)" stroke-width="2"/>';
  if(k>=0)h+='<line x1="'+X(k)+'" x2="'+X(k)+'" y1="8" y2="'+(H-P)+'" stroke-dasharray="4" style="stroke:var(--dn)"/><text x="'+X(k)+'" y="8" font-size="9" text-anchor="middle" style="fill:var(--dn)">رویداد</text>';
  a.forEach(function(x,i){var dd=new Date(x.time*1000).toISOString().slice(5,10);h+='<circle cx="'+X(i)+'" cy="'+Y(x.close)+'" r="3" style="fill:var(--ac)"/><text x="'+X(i)+'" y="'+(H-8)+'" font-size="8" text-anchor="middle" style="fill:var(--mut)">'+dd+'</text>'});
  h+='</svg><div class="e"><div>شروع: $'+Math.round(a[0].close).toLocaleString("en-US")+'</div><div>پایان: $'+Math.round(a[a.length-1].close).toLocaleString("en-US")+'</div><div class="'+C(ch)+'">'+F(ch)+'</div></div>';
  $("ch").outerHTML=h+'<p><a href="'+y+'" target="_blank" rel="noopener">جدول قیمت روزانه در Yahoo Finance ↗</a></p>'
 }).catch(function(){$("ch").outerHTML='<p class="m">نمودار بارگذاری نشد.</p><p><a href="'+y+'" target="_blank" rel="noopener">قیمت‌ها در Yahoo Finance ↗</a></p>'})}
function V(i,m){var n=D.news[i],c=D.cats[n.c],t=c.stats;
 if(m==="s")return O('<h2>اخبار مشابه از ۲۰۱۴</h2><div class="m">'+E(n.ti)+'</div>'+EV(c.events)+'<p><span class="l" data-a="'+i+'" data-m="a">تحلیل ←</span></p>');
 O('<h2>تحلیل نسبت به گذشته</h2><div class="m">'+E(n.ti)+' — دسته: '+c.label+'</div>'+(t?'<div class="k"><div><span class="m">موارد مشابه</span><b>'+t.n+'</b></div><div><span class="m">مثبت در روز رویداد</span><b>'+t.up1+'٪</b></div><div><span class="m">میانگین روز رویداد</span><b class="'+C(t.m1)+'">'+F(t.m1)+'</b></div><div><span class="m">میانگین ۷ روزه</span><b class="'+C(t.m7||0)+'">'+F(t.m7)+'</b></div></div><div><b>بازه‌ی محتمل (چارک ۲۵ تا ۷۵):</b> '+F(t.q25)+' تا '+F(t.q75)+'</div><div class="m">نمونه‌ی '+t.n+' موردی کوچک است؛ این بازه‌ی تاریخی است نه پیش‌بینی. عوامل روز (نرخ بهره، دلار، نفت، ریسک‌پذیری) را جدا بررسی کنید.</div>':'<p>داده‌ای نیست.</p>')+'<h3>رویدادهای مبنا</h3>'+EV(c.events))}
document.addEventListener("click",function(e){var t=e.target;if(t.dataset.ch)CH(t.dataset.ch);else if(t.dataset.a)V(+t.dataset.a,t.dataset.m);else if(t.hasAttribute("data-x")||t===p)p.classList.remove("on")});
</script></body></html>
